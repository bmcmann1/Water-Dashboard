name: Mississippi Combined Dashboard — Manual First
on:
  workflow_dispatch:
  # After the first end-to-end run has been reviewed, uncomment these two lines:
  # schedule:
  #   - cron: '0 14 * * 1'  # Monday 8am CST / 9am CDT
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mississippi-combined-pages
  cancel-in-progress: false
jobs:
  acquire-qc-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: NOAA and HEFS
        run: python scripts/acquire_noaa.py
      - name: USGS three-route acquisition and bounded USACE discovery
        env:
          REFRESH_USACE_CATALOG: "1"
        run: python scripts/acquire_usgs_usace.py
      - name: Discover NOAA gauge-to-NWM candidates (audit only; no auto-approval)
        run: python scripts/discover_nwm_reaches.py --enable-gis
      - name: Approved NOAA NWM reaches (bounded, deduplicated; safe no-op if unverified)
        run: python scripts/acquire_nwm.py
      - name: Approved USACE time series (structure operations excluded)
        run: python scripts/acquire_usace_series.py
      - name: Verify USGS-NWM pairs and near-mouth routing evidence (no extra downloads)
        run: python scripts/verify_nwm_pairing.py
      - name: Verify every station, source route and near-mouth evidence
        run: python scripts/complete_verification.py
      - name: Normalize and 24-hour QC
        run: python scripts/normalize_qc.py
      - name: Discover backups only where fresh primary discharge is unavailable
        # Catalog outages must not invalidate a healthy primary acquisition.
        # Discovery writes a diagnostic report even when an individual catalog fails.
        continue-on-error: true
        run: python scripts/discover_fallbacks.py
      - name: Build embedded dashboard
        run: python scripts/build_dashboard.py
      - name: Verify acquisition and continuity diagnostics
        run: python scripts/verify_release.py
      - name: Test outputs
        run: python -m unittest discover -s tests -v
      - name: Publication safety gate
        run: python scripts/publication_gate.py
      - name: Upload complete acquisition and QC even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mississippi-combined-audit-${{ github.run_number }}
          path: |
            output/
            site/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload dashboard for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: acquire-qc-build
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  notify:
    needs: [acquire-qc-build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: mississippi-combined-audit-*
          merge-multiple: true
      - name: Send post-deployment email
        env:
          DASHBOARD_URL: ${{ needs.deploy.outputs.page_url }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python scripts/email_report.py
